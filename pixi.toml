[workspace]
authors = ["SPARK Microsystems <spark-fw@sparkmicro.com>"]
channels = ["https://prefix.dev/sparkmicro-sdk", "conda-forge"]
name = "SPARK Microsystems"
platforms = ["linux-64", "win-64"]
version = "2.3.0"
description = "SPARK Microsystems SDK Development Environment"
homepage = "https://www.sparkmicro.com/"
documentation = "https://www.sparkmicro.com/sdk-docs/"

[environments.spark-sdk]
features = ["spark-sdk-build", "spark-sdk-flash"]
solve-group = "sdk"

[feature.spark-sdk-build.dependencies]
cmake = "==3.31.8"
gcc-arm-none-eabi = "==10.3.2021.10"
make = "*"
ninja = "==1.11.0"

[feature.spark-sdk-flash.dependencies]
dfu-util-spark = "*"
pip = "==22.2.1"
pyocd-packs = ">=1.1.0"
python = "==3.10.5"

[feature.spark-sdk-flash.pypi-dependencies]
pyocd = "==0.37.0"

[feature.spark-sdk-build.tasks._build_preset]
description = "Build a specific preset defined by PRESET env var"
cmd = "cmake --preset=$PRESET -G Ninja && cmake --build build/$PRESET"

[feature.spark-sdk-build.tasks.build-all]
description = "Build all SDK example presets"
cmd = "python -c \"import json, subprocess, os; [subprocess.run(['pixi', 'run', '_build_preset'], env={**os.environ, 'PRESET': p['name']}, check=True) for p in json.load(open('CMakePresets.json'))['configurePresets'] if not p.get('hidden', False) and 'datacom' not in p['name'] and 'unit-tests' not in p['name'] and p.get('cacheVariables', {}).get('APP') != 'Datacom']\""

[feature.spark-sdk-build.tasks.build-puretone-master-rjf]
description = "Incremental build puretone headset U5A5 I2S master RJF variant (2 bins)"
cmd = """python -c "import subprocess; p='puretone-headset-quasar-u5a5-master-rjf'; subprocess.run(['cmake', '--preset='+p, '-G', 'Ninja'], check=True); subprocess.run(['cmake', '--build', 'build/'+p], check=True)" """

[feature.spark-sdk-build.tasks.clean-build-puretone-master-rjf]
description = "Clean rebuild puretone headset U5A5 I2S master RJF variant (2 bins)"
cmd = """python -c "import subprocess, shutil; p='puretone-headset-quasar-u5a5-master-rjf'; shutil.rmtree('build/'+p, ignore_errors=True); subprocess.run(['cmake', '--preset='+p, '-G', 'Ninja'], check=True); subprocess.run(['cmake', '--build', 'build/'+p], check=True)" """

[feature.spark-sdk-build.tasks.build-puretone-variants]
description = "Build all 6 puretone headset U5A5 I2S variants (master/slave x RJF/LJF/STD)"
cmd = """python -c "import subprocess, os; presets=['puretone-headset-quasar-u5a5-master-rjf','puretone-headset-quasar-u5a5-master-ljf','puretone-headset-quasar-u5a5-master-std','puretone-headset-quasar-u5a5-slave-rjf','puretone-headset-quasar-u5a5-slave-ljf','puretone-headset-quasar-u5a5-slave-std']; run=lambda p: [subprocess.run(['cmake', '--preset='+p, '-G', 'Ninja'], check=True), subprocess.run(['cmake', '--build', 'build/'+p], check=True)]; [run(p) for p in presets]" """

[feature.spark-sdk-build.tasks.clean-build-puretone-variants]
description = "Clean rebuild all 6 puretone headset U5A5 I2S variants (12 bins total)"
cmd = """python -c "import subprocess, os, shutil; presets=['puretone-headset-quasar-u5a5-master-rjf','puretone-headset-quasar-u5a5-master-ljf','puretone-headset-quasar-u5a5-master-std','puretone-headset-quasar-u5a5-slave-rjf','puretone-headset-quasar-u5a5-slave-ljf','puretone-headset-quasar-u5a5-slave-std']; run=lambda p: [shutil.rmtree('build/'+p, ignore_errors=True), subprocess.run(['cmake', '--preset='+p, '-G', 'Ninja'], check=True), subprocess.run(['cmake', '--build', 'build/'+p], check=True)]; [run(p) for p in presets]; os.makedirs('dist', exist_ok=True); [shutil.copy2('build/'+p+'/app/example/puretone_headset/'+n+'.bin', 'dist/'+n+'_'+p.replace('puretone-headset-quasar-','').replace('-','_')+'.bin') or print('Collected: dist/'+n+'_'+p.replace('puretone-headset-quasar-','').replace('-','_')+'.bin') for p in presets for n in ['puretone_headset','puretone_dongle']]" """

[feature.spark-sdk-build.tasks.build-puretone-u535-master-rjf]
description = "Incremental build puretone headset U535 I2S master RJF variant (2 bins)"
cmd = """python -c "import subprocess; p='puretone-headset-quasar-u535-master-rjf'; subprocess.run(['cmake', '--preset='+p, '-G', 'Ninja'], check=True); subprocess.run(['cmake', '--build', 'build/'+p], check=True)" """

[feature.spark-sdk-build.tasks.clean-build-puretone-u535-master-rjf]
description = "Clean rebuild puretone headset U535 I2S master RJF variant (2 bins)"
cmd = """python -c "import subprocess, shutil; p='puretone-headset-quasar-u535-master-rjf'; shutil.rmtree('build/'+p, ignore_errors=True); subprocess.run(['cmake', '--preset='+p, '-G', 'Ninja'], check=True); subprocess.run(['cmake', '--build', 'build/'+p], check=True)" """

[feature.spark-sdk-build.tasks.build-puretone-u535-variants]
description = "Build all 6 puretone headset U535 I2S variants (master/slave x RJF/LJF/STD)"
cmd = """python -c "import subprocess; presets=['puretone-headset-quasar-u535-master-rjf','puretone-headset-quasar-u535-master-ljf','puretone-headset-quasar-u535-master-std','puretone-headset-quasar-u535-slave-rjf','puretone-headset-quasar-u535-slave-ljf','puretone-headset-quasar-u535-slave-std']; run=lambda p: [subprocess.run(['cmake', '--preset='+p, '-G', 'Ninja'], check=True), subprocess.run(['cmake', '--build', 'build/'+p], check=True)]; [run(p) for p in presets]" """

[feature.spark-sdk-build.tasks.clean-build-puretone-u535-variants]
description = "Clean rebuild all 6 puretone headset U535 I2S variants (12 bins total)"
cmd = """python -c "import subprocess, os, shutil; presets=['puretone-headset-quasar-u535-master-rjf','puretone-headset-quasar-u535-master-ljf','puretone-headset-quasar-u535-master-std','puretone-headset-quasar-u535-slave-rjf','puretone-headset-quasar-u535-slave-ljf','puretone-headset-quasar-u535-slave-std']; run=lambda p: [shutil.rmtree('build/'+p, ignore_errors=True), subprocess.run(['cmake', '--preset='+p, '-G', 'Ninja'], check=True), subprocess.run(['cmake', '--build', 'build/'+p], check=True)]; [run(p) for p in presets]; os.makedirs('dist', exist_ok=True); [shutil.copy2('build/'+p+'/app/example/puretone_headset/'+n+'.bin', 'dist/'+n+'_'+p.replace('puretone-headset-quasar-u535-','u535_').replace('-','_')+'.bin') or print('Collected: dist/'+n+'_'+p.replace('puretone-headset-quasar-u535-','u535_').replace('-','_')+'.bin') for p in presets for n in ['puretone_headset','puretone_dongle']]" """

[feature.spark-sdk-flash.tasks.flash]
description = "Flash a binary to the device (DFU)"
cmd = "python script/dfu-util.py"

[feature.spark-sdk-build.target.linux-64.activation]
scripts = ["script/banner.sh"]

[feature.spark-sdk-build.target.win-64.activation]
scripts = ["script/banner.bat"]

[feature.spark-sdk-flash.target.win-64.dependencies]
qmk-driver-installer = "==1.0.0"
